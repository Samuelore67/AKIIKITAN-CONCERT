<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <!-- AI-Styled Illustrated Avatar of the Owner — TailwindCSS -->
<div class="max-w-sm mx-auto p-6 bg-white rounded-2xl shadow-xl">
  
  <!-- Avatar Circle -->
  <div class="w-40 h-40 rounded-full bg-gradient-to-b from-gray-200 to-gray-300 mx-auto flex items-center justify-center shadow-inner">
    <!-- Head -->
    <div class="w-24 h-24 bg-[#d9a77b] rounded-full relative">
      
      <!-- Hair -->
      <div class="absolute top-0 left-0 w-full h-10 bg-[#372b23] rounded-t-full"></div>

      <!-- Sunglasses -->
      <div class="absolute top-8 left-1/2 -translate-x-1/2 flex gap-1">
        <div class="w-6 h-4 bg-black rounded-sm"></div>
        <div class="w-6 h-4 bg-black rounded-sm"></div>
      </div>

      <!-- Beard -->
      <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-20 h-10 bg-[#3a2c23] rounded-b-full"></div>
    </div>
  </div>

  <!-- Body Illustration -->
  <div class="mt-6 text-center">
    <div class="inline-block px-6 py-4 rounded-xl bg-white border shadow-sm">
      
      <!-- Clothing (white agbada-style top) -->
      <div class="w-32 h-36 bg-white rounded-xl mx-auto relative border border-gray-200 shadow">
        
        <!-- Gold chest designs -->
        <div class="absolute top-6 left-6 w-10 h-1 bg-yellow-500 rounded"></div>
        <div class="absolute top-8 left-6 w-10 h-1 bg-yellow-500 rounded"></div>

        <div class="absolute top-6 right-6 w-10 h-1 bg-yellow-500 rounded"></div>
        <div class="absolute top-8 right-6 w-10 h-1 bg-yellow-500 rounded"></div>
      </div>

      <!-- Name -->
      <p class="mt-4 text-xl font-bold text-gray-900">
        Akiikitan
      </p>

      <p class="text-gray-600 text-sm">
        Founder & Visionary Leader
      </p>
    </div>
  </div>
</div>

</body>
</html>
